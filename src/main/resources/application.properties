# WRITE_DELAY=0 makes every transaction commit synchronously durable in the
# H2 write-ahead log, so a crash can never lose a committed loan unit.
spring.datasource.url=jdbc:h2:file:${flashloan.data-dir:./data}/flashloan;DB_CLOSE_DELAY=-1;WRITE_DELAY=0
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

spring.jackson.serialization.write-dates-as-timestamps=false
server.port=${flashloan.port:8080}
