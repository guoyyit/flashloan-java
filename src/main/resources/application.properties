server.port=8080

# ===== 本地闪电贷服务配置 =====
# 持久化快照目录（WAL 崩溃恢复的唯一事实来源）
flashloan.data-dir=data/flashloan
# 默认手续费率（占借款本金比例，0.001 = 0.1%）
flashloan.default-fee-rate=0.001
# 默认单笔借款本金上限
flashloan.default-max-loan-amount=1000000
# 默认单个借款单元的资金操作步数上限
flashloan.default-max-steps=50
# 单个借款单元执行超时（毫秒），超时整体回滚
flashloan.execution-timeout-ms=5000
# 测试辅助：每步操作注入延时（毫秒），生产环境保持 0
flashloan.test-step-delay-ms=0
